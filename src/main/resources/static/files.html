<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Desktop</title>
    <link rel="stylesheet" href="/css/files.css">
    <link rel="shortcut icon" href="/favicon/files.png" type="image/x-icon">
</head>

<body>

    <main class="app-container">

        <section id="drop-zone" class="upload-area">
            <div class="upload-content">
                <svg class="upload-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                    xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12">
                    </path>
                </svg>
                <h2>Drop files to upload</h2>
                <p>or click to browse</p>
                <input type="file" id="file-input" multiple hidden>
                <div id="progress-bar-container">
                    <div id="progress-bar"></div>
                </div>
            </div>
        </section>

        <section class="browser-window">

            <div class="browser-header">
                <div class="breadcrumb">
                    <span class="root">Home</span>
                </div>
            </div>

            <div class="folder-grid-area">
                <div class="section-header">
                    <h4 class="section-label">Quick Access / Most Used Files</h4>
                    <span class="badge">Top 4</span>
                </div>
                <div id="file-grid" class="grid-container">
                </div>
            </div>

            <div class="file-list-area">
                <h4 class="section-label">Subdirectories</h4>
                <div class="list-header">
                    <span>Folder Name</span>
                    <span>Last Updated</span>
                    <span>Items</span>
                </div>
                <div class="scroll-viewport">
                    <ul id="folder-list">
                    </ul>
                </div>
            </div>

        </section>

    </main>

    <script src="/js/files.js"></script>
</body>

</html>
