spring.application.name=FileServer
spring.output.ansi.enabled=ALWAYS
spring.devtools.restart.enabled=true
spring.config.import=optional:file:.env[.properties]
spring.web.error.include-message=ALWAYS


# ===============================
# = UPLOADED DATA SIZE
# ===============================
#  Increase max size for accepted files.
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
server.port=${SERVER_PORT}
server.http.port=${SERVER_HTTP_PORT}
server.address=${SERVER_ADDRESS}
server.http2.enabled=true
server.ssl.enabled=true
server.tomcat.max-http-form-post-size=524288000
spring.servlet.multipart.resolve-lazily=true
spring.servlet.multipart.file-size-threshold=10MB
server.tomcat.max-swallow-size=-1
server.tomcat.connection-timeout=120000

# ===============================
# = DATA SOURCE
# ===============================
# Configurations for the database connection

spring.datasource.url=${PGURL}
# jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=${DATASOURCE_DRIVER}
spring.jpa.open-in-view=false

# ===============================
# = FLYWAY MIGRATION
# ===============================
# Flyway configurations for the database migrations 
spring.flyway.url=${PGURL}
# jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
spring.flyway.user=${POSTGRES_USER}
spring.flyway.password=${POSTGRES_PASSWORD}
spring.flyway.driver-class-name=${DATASOURCE_DRIVER}

# ===============================
# = Session Managment
# ===============================
# Bank level security / Session Managment
server.servlet.session.timeout=13m
server.servlet.session.cookie.max-age=-1
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=STRICT
server.servlet.session.cookie.name=__Host-SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.path=/


# ===============================
# = SPRING SECURITY
# ===============================
# Flyway configurations for the database migrations 
spring.security.user.name=${USER}
spring.security.user.password=${PASSWORD}
spring.security.user.roles=${ROLE}

# ===============================
# = SPRING SSL
# ===============================

# PKCS12 Configuration
server.ssl.key-store-type=PKCS12
server.ssl.key-store=classpath:${SERVER_P12}
server.ssl.key-store-password=${CERT_PASSWORD}
server.ssl.key-alias=${KEY_ALIAS}

# Custom Values
fileserver.publickeycredentialrpentity.name="Home FileServer"
fileserver.publickeycredentialrpentity.id=${RP_ENTITY_ID}
fileserver.permission.policy.header=accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()
fileserver.content.security.policy.header=default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; require-trusted-types-for 'script'; trusted-types default;
fileserver.allowed.hosts=https://localhost:8443, https://192.168.0.149:8443, https://192.168.0.149:80, https://192.168.10.161:8443, https://alanis-laptop.local:8443, https://192.168.0.149.nip.io:8443, https://fileserver.local, https://192.168.0.149.nip.io, https://kdriver.duckdns.org
app.storage.location=user-data
external.file.name=${EXTERNAL_FILE_NAME}
external.drive.uuid=${EXTERNAL_STORAGE_UUID}


# Virtual Threads
spring.threads.virtual.enabled=true
spring.main.keep-alive=true
spring.thread-executor=virtual